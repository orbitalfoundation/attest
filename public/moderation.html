<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>attest · moderation</title>
<meta name="description" content="Every moderation action on attest, with who took it and why."><link rel="canonical" href="https://attest.monster/moderation"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body><main>
<h1>moderation <small>every action, public</small></h1>
<p>Admins can hide a record or an account from attest's counts and pages. Nothing is deleted: the record stays in its author's repository, and hiding can be undone. Every hide and unhide is listed here, with who did it and why.</p>
<p class="small muted" id="admins"></p>
<ul id="log"><li class="muted">loading…</li></ul>
</main>
<script type="module">
import "/menu.js";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const d = await fetch("/moderation.json").then((r) => r.json());
document.getElementById("admins").innerHTML = "Admins: " + d.admins.map((a) => `<code>${esc(a)}</code>`).join(", ");
document.getElementById("log").innerHTML = d.actions.map((m) => `<li>${new Date(m.at).toLocaleString()} · <a href="/${esc(m.by_handle)}">@${esc(m.by_handle)}</a> ${esc(m.action)} ${esc(m.kind)} <code>${esc(m.subject)}</code>${m.reason ? ` · ${esc(m.reason)}` : ""}</li>`).join("") || "<li class='muted'>No moderation actions yet.</li>";
</script></body></html>
