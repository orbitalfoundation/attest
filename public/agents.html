<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents</title><meta name="description" content="Approve an agent to act for you, or see who an agent acts for and within what bounds.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
<style>.code{font:600 1.6rem/1.2 ui-monospace,monospace;letter-spacing:.08em}.perm label{display:flex;gap:.6rem;align-items:center;margin:.35rem 0}.perm input{width:auto;margin:0}.kv{width:100%;table-layout:fixed}.kv td{overflow-wrap:anywhere;vertical-align:top}.kv td:first-child{color:var(--muted);padding-right:1rem;width:7.5rem}</style></head><body><main>
<h1 id="h">agents</h1>
<div id="out"><p class="muted">loading…</p></div>
<p id="msg" class="small"></p>
</main>
<script type="module">
import "/menu.js";
import * as A from "/attest-core.js";
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const msg = (t, cls = "") => { $("msg").textContent = t; $("msg").className = "small " + cls; };
const KIND = { vote: "upvotes", comment: "comments", statement: "statements", vouch: "vouches", claim: "claims", bookmark: "bookmarks" }, ACT = { create: "write", update: "change", delete: "retract" };
// "repo:monster.attest.comment?action=create" → "write comments"
const plain = (p) => { const m = /^repo:monster\.attest\.([a-z]+)(?:\?(.*))?$/.exec(p); if (!m) return p; const acts = m[2] ? [...new URLSearchParams(m[2]).getAll("action")] : ["create", "update", "delete"]; return acts.map((a) => ACT[a]).join(", ") + " " + (KIND[m[1]] || m[1]) + (m[1] === "vouch" ? " (a vouch by your agent is your vouch)" : ""); };
const path = location.pathname;

if (path.startsWith("/agent/")) {
  // Public view of one agent permission.
  const id = path.split("/")[2]; const a = await fetch("/agent/" + id + "?format=json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).catch(() => null);
  if (!a) { $("out").innerHTML = `<p>No agent permission with that id.</p>`; } else {
    document.title = a.name + " · agent"; $("h").textContent = a.name;
    const live = !a.revoked && Date.parse(a.until) > Date.now();
    $("out").innerHTML = `<p>An agent acting for <a href="/${esc(a.handle)}">@${esc(a.handle)}</a>, ${live ? "within these bounds:" : `<b>no longer valid</b> (${a.revoked ? "revoked " + new Date(a.revoked).toLocaleString() : "expired"}).`}</p>
      <table class="kv"><tr><td>purpose</td><td>${esc(a.purpose || "—")}</td></tr><tr><td>may</td><td>${a.permissions.map((p) => esc(plain(p))).join("<br>")}</td></tr>
      <tr><td>at most</td><td>${a.limits.perDay} records a day</td></tr><tr><td>valid</td><td>${new Date(a.from).toLocaleDateString()} to ${new Date(a.until).toLocaleDateString()}</td></tr>
      <tr><td>agent key</td><td><code>${esc(a.agent)}</code></td></tr><tr><td>permission id</td><td><code>${esc(a.id)}</code></td></tr></table>
      <p class="small muted">@${esc(a.handle)}'s passkey signed this permission; the signature is in the public <a href="/log">log</a> (entry type "agent"). Anything this agent signs carries its key and this id, is written into @${esc(a.handle)}'s own repository, and counts as theirs: an agent adds no trust of its own. The permissions are AT Protocol permission strings: <code>${a.permissions.map(esc).join("</code>, <code>")}</code>.</p>`;
  }
} else {
  // Approve a pending request.
  const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
  const s = A.session();
  if (!s || A.server !== location.origin) { $("out").innerHTML = `<p>An agent wants to act for you. <a href="/login?return=${encodeURIComponent(location.pathname + location.search)}">Sign in</a> first, then you will see what it asks for.</p>`; }
  else {
    let ask; try { ask = await A.req("agent.pending", { code }); } catch (e) { $("out").innerHTML = `<p>${esc(e.message)}</p>`; ask = null; }
    if (ask) {
      $("h").textContent = "an agent asks to act for you";
      $("out").innerHTML = `<p>Check this code matches the one your agent shows:</p><p class="code">${esc(ask.code)}</p>
        <table class="kv"><tr><td>name</td><td><b>${esc(ask.name)}</b></td></tr><tr><td>purpose</td><td>${esc(ask.purpose || "—")}</td></tr><tr><td>its key</td><td><code>${esc(ask.agent.slice(0, 24))}…</code></td></tr><tr><td>for</td><td>@${esc(s.handle)}</td></tr></table>
        <h2>It may</h2><div class="perm">${ask.permissions.map((p, i) => `<label><input type="checkbox" data-p="${esc(p)}" checked> ${esc(plain(p))}</label>`).join("")}</div>
        <p><label>at most <input id="perday" type="number" min="1" max="${ask.limits.perDay}" value="${ask.limits.perDay}" style="width:6rem"> records a day</label></p>
        <p><label>for <input id="days" type="number" min="1" max="${ask.days}" value="${ask.days}" style="width:5rem"> days</label></p>
        <p class="small muted">This permission will be public: anyone can see that this agent acts for you and within these bounds. You can revoke it at any time on <a href="/me">your page</a>.</p>
        <p><button id="ok">Approve with passkey</button> <a href="/me" class="small">no thanks</a></p>`;
      $("ok").onclick = async () => {
        $("ok").disabled = true;
        try {
          const permissions = [...document.querySelectorAll("[data-p]")].filter((c) => c.checked).map((c) => c.dataset.p); if (!permissions.length) throw new Error("choose at least one thing it may do");
          const perDay = Math.min(ask.limits.perDay, Math.max(1, parseInt($("perday").value, 10) || 1)), days = Math.min(ask.days, Math.max(1, parseInt($("days").value, 10) || 1));
          const now = new Date(), delegation = { v: 1, type: "agent", root: s.root, agent: ask.agent, agentKey: ask.agentKey, name: ask.name, purpose: ask.purpose, permissions, limits: { perDay }, from: now.toISOString(), until: new Date(now.getTime() + days * 86400e3).toISOString() };
          const { options } = await A.req("agent.start", { code, delegation });
          msg("Your passkey signs the permission…");
          const cred = await navigator.credentials.get({ publicKey: A.requestOptions(options) });
          const r = await A.req("agent.finish", { code, delegation, credentialId: cred.id, assertion: A.credToJSON(cred) });
          $("out").innerHTML = `<p class="ok">Approved. ${esc(ask.name)} can now act for you within those bounds; it will pick this up on its own.</p><p><a href="/agent/${r.id}">See the public permission</a> · <a href="/me">your agents</a></p>`; msg("");
        } catch (e) { msg(e.message, "err"); $("ok").disabled = false; }
      };
    }
  }
}
</script></body></html>
