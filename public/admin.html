<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>attest · admin</title>
<meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
<style>main{max-width:60rem}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem}.tiles div{border:1px solid var(--line);border-radius:4px;padding:.6rem}.tiles b{display:block;font-size:1.3rem}.tiles span{font-size:.8rem;color:var(--muted)}table{font-size:.88rem}td button{padding:.15rem .5rem;font-size:.8rem}.st-hidden{color:#b45309}.st-deleted,.st-retracted{color:var(--muted)}</style></head><body><main>
<h1>admin <small id="who"></small></h1>
<p class="small muted">Every request on this page is signed by your key. Hiding is reversible and every hide or unhide is published at <a href="/moderation">/moderation</a>.</p>
<div id="gate"></div>
<section id="panel" hidden>
<h2>Health</h2><div class="tiles" id="tiles"></div>
<h2>Accounts</h2><table id="accounts"><thead><tr><th>handle</th><th>joined</th><th>records</th><th>passkeys</th><th>kind</th><th>status</th><th></th></tr></thead><tbody></tbody></table>
<h2>Recent records</h2><table id="records"><thead><tr><th>when</th><th>who</th><th>kind</th><th>subject</th><th>state</th><th></th></tr></thead><tbody></tbody></table>
<h2>Reserved handles</h2><p class="small muted" id="builtin"></p><ul id="added" class="small"></ul>
<form id="reserve" style="display:flex;gap:.4rem;max-width:24rem"><input id="rname" placeholder="handle to reserve"><button class="quiet">reserve</button></form>
<h2>Moderation log</h2><ul id="modlog" class="small"></ul>
<p id="msg" class="small"></p>
</section>
</main>
<script type="module">
import * as A from "/attest-core.js"; import "/menu.js";
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const msg = (t, c = "") => { $("msg").textContent = t; $("msg").className = "small " + c; };
const s = A.session();
if (!s) { $("gate").innerHTML = `<p><a href="/login?return=/admin">Sign in</a> as an admin.</p>`; throw new Error("no session"); }
$("who").textContent = "@" + s.handle;
let ov; try { ov = await A.adminReq("overview"); } catch (e) { $("gate").innerHTML = `<p class="err">${esc(e.message)}</p>`; throw e; }
$("panel").hidden = false;
const when = (t) => t ? new Date(t).toLocaleString() : "";
const tile = (v, l) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
$("tiles").innerHTML = [tile(ov.stats.accounts, "active accounts"), tile(ov.stats.records, "live records"), tile(ov.log, "log entries"), tile(ov.firehoseCursor ?? "none", "firehose cursor"), tile(ov.pds?.startsWith("did:") ? "ok" : ov.pds, "data server"), tile(ov.oauth ? "ready" : "off", "handle sign-in"), tile(ov.disk ? `${ov.disk.freeGB} / ${ov.disk.totalGB} GB` : "?", "disk free"), tile(ov.memoryMB + " MB", "memory"), tile(ov.uptimeMin + " min", "uptime"), tile(ov.node, "node")].join("");
async function load() {
  const [accts, recs, res, mod] = await Promise.all([A.adminReq("accounts"), A.adminReq("records", { limit: 80 }), A.adminReq("reserved"), A.adminReq("moderation")]);
  $("accounts").querySelector("tbody").innerHTML = accts.map((a) => `<tr><td><a href="/${esc(a.handle)}">@${esc(a.handle)}</a><div class="muted" style="font-size:.75rem">${esc(a.did)}</div></td><td>${when(a.created)}</td><td>${a.records}</td><td>${a.passkeys}</td><td>${a.hosted ? "hosted here" : "own server"}</td><td class="st-${esc(a.status || "active")}">${esc(a.status || "active")}</td><td>${a.status === "hidden" ? `<button class="quiet" data-act="unhide" data-kind="account" data-subject="${esc(a.did)}">unhide</button>` : (!a.status || a.status === "active") ? `<button class="quiet" data-act="hide" data-kind="account" data-subject="${esc(a.did)}">hide</button>` : ""}</td></tr>`).join("");
  $("records").querySelector("tbody").innerHTML = recs.map((r) => `<tr><td>${when(r.at)}</td><td>@${esc(r.handle || "?")}</td><td>${esc(r.kind)}</td><td style="max-width:22rem;word-break:break-all">${esc(r.target)}${r.body ? `<div class="muted">${esc(r.body.slice(0, 140))}</div>` : ""}</td><td class="st-${r.state}">${r.state}</td><td>${r.state === "live" ? `<button class="quiet" data-act="hide" data-kind="record" data-subject="${esc(r.uri || r.id)}">hide</button>` : r.state === "hidden" ? `<button class="quiet" data-act="unhide" data-kind="record" data-subject="${esc(r.uri || r.id)}">unhide</button>` : ""}</td></tr>`).join("");
  $("builtin").textContent = `${res.builtIn.length} built in, including every page name. Added by admins:`;
  $("added").innerHTML = res.added.map((r) => `<li>${esc(r.key)} <span class="muted">${when(r.at)}</span> <button class="quiet small" data-unreserve="${esc(r.key)}">remove</button></li>`).join("") || "<li class='muted'>none</li>";
  $("modlog").innerHTML = mod.map((m) => `<li>${when(m.at)} · @${esc(m.by_handle)} ${esc(m.action)} ${esc(m.kind)} <code>${esc(m.subject)}</code>${m.reason ? ` · ${esc(m.reason)}` : ""}</li>`).join("") || "<li class='muted'>nothing yet</li>";
}
await load();
document.body.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act], button[data-unreserve]"); if (!b) return;
  try {
    if (b.dataset.unreserve) { await A.adminReq("unreserve", { handle: b.dataset.unreserve }); }
    else { const reason = prompt(`Reason to ${b.dataset.act} this ${b.dataset.kind} (published at /moderation):`, ""); if (reason === null) return; await A.adminReq(b.dataset.act, { kind: b.dataset.kind, subject: b.dataset.subject, reason }); }
    msg("done", "ok"); await load();
  } catch (err) { msg(err.message, "err"); }
});
$("reserve").onsubmit = async (e) => { e.preventDefault(); try { await A.adminReq("reserve", { handle: $("rname").value }); $("rname").value = ""; msg("reserved", "ok"); await load(); } catch (err) { msg(err.message, "err"); } };
</script></body></html>
