<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>attest · site</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body><main>
<h1 id="h">…</h1>
<p class="muted small" id="totals"></p>
<p class="small" id="claims"></p>
<h2>Most attested pages</h2>
<table id="t"><thead><tr><th>page</th><th>▲</th><th>comments</th><th>keys</th><th>last</th></tr></thead><tbody></tbody></table>
<p class="muted small" id="empty"></p>
<h2>Recent comments</h2>
<ul id="recent" class="small"></ul>
<p class="small muted">Public by construction: every count here is derived from signed records anyone can read at <code>/log</code>. A site owner can claim this domain from their <a href="/me">own page</a>; verified claims show above. Machine-readable: <code id="json"></code>.</p>
</main>
<script type="module">
import * as A from "/attest-core.js"; import "/menu.js";
const host = decodeURIComponent(location.pathname.replace(/^\/site\//, "")), $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const path = (u) => { try { const x = new URL(u); return x.pathname + x.search; } catch { return u; } };
const r = await fetch("/domain/" + encodeURIComponent(host)); if (!r.ok) { $("h").textContent = "not a host"; throw new Error("400"); }
const d = await r.json(); document.title = "attest · " + d.host; $("h").textContent = d.host; $("json").textContent = location.origin + "/domain/" + d.host;
$("totals").textContent = `${d.totals.records} live records on ${d.totals.targets} pages from ${d.totals.keys} keys`;
$("claims").innerHTML = d.claims.length ? d.claims.map((c) => `${c.verified ? '<span class="ok">✓</span>' : '<span class="muted">unverified claim:</span>'} <a href="/@${esc(c.handle)}">@${esc(c.handle || A.short(c.by))}</a> ${c.verified ? "controls this domain" : ""}`).join("<br>") : "";
document.querySelector("#t tbody").innerHTML = d.targets.map((t) => `<tr><td><a href="${esc(t.target)}">${esc(path(t.target))}</a></td><td>${t.upvotes}</td><td>${t.comments}</td><td>${t.keys}</td><td class="small muted">${new Date(t.last).toLocaleDateString()}</td></tr>`).join("");
if (!d.targets.length) $("empty").innerHTML = `Nothing attested on ${esc(d.host)} yet. Add the <a href="/docs">widget</a>.`;
$("recent").innerHTML = d.recent.map((c) => `<li><a href="/@${esc(c.handle)}">@${esc(c.handle || A.short(c.by))}</a> on <a href="${esc(c.target)}">${esc(path(c.target))}</a>: ${esc(c.body)} <span class="muted">${new Date(c.at).toLocaleDateString()}</span></li>`).join("") || "<li class='muted'>none</li>";
</script></body></html>
