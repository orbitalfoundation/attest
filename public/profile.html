<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>attest · profile</title>
<meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/style.css"></head><body><main>
<h1 id="h">…</h1>
<p class="muted small" id="who"></p>
<p id="vouchrow"></p>
<h2>Bookmarks <span id="nb" class="muted"></span></h2>
<p id="mytags" class="small"></p>
<ul id="bms" class="small" style="padding-left:1.1rem"></ul>
<h2>About this person</h2>
<p class="small muted" id="aboutsum"></p>
<div id="aboutw"></div>
<ul id="aboutelse" class="small"></ul>
<h2>Vouched for by <span id="nvb" class="muted"></span></h2>
<ul id="vouchedby" class="small"></ul>
<h2>Elsewhere on AT Protocol</h2>
<ul id="elsewhere" class="small"></ul>
<h2>Proofs of control</h2>
<ul id="proofs" class="small"></ul>
<h2>Vouches for <span id="nv" class="muted"></span></h2>
<ul id="vouches" class="small"></ul>
<h2>Statements and comments</h2>
<table id="t"><tbody></tbody></table>
<p class="muted small" id="counts"></p>
</main>
<script type="module">
import * as A from "/attest-core.js"; import "/menu.js";
const handle = decodeURIComponent(location.pathname.replace(/^\/@?/, "").replace(/\/$/, "")).replace(/\.attest\.monster$/, ""), $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const link = (t) => /^https?:/.test(t) ? `<a href="${esc(t)}">${esc(t)}</a>` : esc(t);
const r = await fetch("/handle/" + encodeURIComponent(handle)); if (!r.ok) { $("h").textContent = "no such handle"; throw new Error("404"); }
const me = await r.json(); document.title = "attest · @" + me.handle;
{ const l = document.createElement("link"); l.rel = "canonical"; l.href = location.origin + "/" + me.handle; document.head.appendChild(l); if (location.pathname !== "/" + me.handle) history.replaceState(null, "", "/" + me.handle + location.search); }
$("h").textContent = "@" + me.handle + (me.service ? " (the service)" : "");
$("who").innerHTML = `<code>${esc(me.repoHandle || me.handle)}</code> · <a href="https://bsky.app/profile/${esc(me.repoHandle || me.did)}">on Bluesky</a> · <code>${esc(me.did)}</code>${me.since ? " · since " + new Date(me.since).toLocaleDateString() : ""} · ${me.keys.length} passkey${me.keys.length === 1 ? "" : "s"} · <a href="/by/${encodeURIComponent(me.did)}">json</a>`;
$("nvb").textContent = me.vouchedBy.length; $("nv").textContent = me.vouches.length;
$("vouchedby").innerHTML = me.vouchedBy.map((v) => `<li><a href="/${esc(v.handle)}">@${esc(v.handle || A.short(v.by))}</a> <span class="muted">${new Date(v.at).toLocaleDateString()}</span></li>`).join("") || "<li class='muted'>nobody yet</li>";
$("vouches").innerHTML = me.vouches.map((v) => `<li><a href="/${esc(v.handle)}">@${esc(v.handle || A.short(v.target))}</a> <span class="muted">${new Date(v.at).toLocaleDateString()}</span></li>`).join("") || "<li class='muted'>nobody yet</li>";
$("proofs").innerHTML = me.proofs.map((p) => `<li>${link(p.target)} ${p.verifications.length ? `<span class="ok">✓ verified</span> by ${p.verifications.map((v) => `<a href="/${esc(v.handle)}">@${esc(v.handle || A.short(v.by))}</a> (<a href="${esc(v.evidence)}">evidence</a>)`).join(", ")}` : `<span class="muted">claimed, unverified</span>`}</li>`).join("") || "<li class='muted'>none</li>";
document.querySelector("#t tbody").innerHTML = me.records.filter((x) => (x.kind === "statement" || x.kind === "comment") && !x.retracted).map((x) => `<tr><td class="small muted">${new Date(x.at).toLocaleDateString()}</td><td>${esc(x.body)}<div class="small muted">${x.kind} on ${link(x.target)}</div></td></tr>`).join("") || "<tr><td class='muted'>none yet</td></tr>";
const kindLabel = { "tangled.vouch": "vouches for on Tangled", "tangled.denounce": "denounces on Tangled", "tangled.follow": "follows on Tangled", "bsky.follow": "follows on Bluesky" };
const inLabel = { "tangled.vouch": "vouches on Tangled", "tangled.denounce": "denounces on Tangled", "tangled.follow": "follows on Tangled", "bsky.follow": "follows on Bluesky" };
$("elsewhere").innerHTML = (me.elsewhere.map((l) => `<li><a href="https://bsky.app/profile/${esc(l.handle)}">@${esc(l.handle)}</a> <span class="ok">✓ proven</span> · ${Object.entries(l.out).map(([k, n]) => `${n} ${esc((kindLabel[k] || k).replace(/^(vouches for|denounces|follows)/, (m) => m))}`).join(" · ") || "no graph records"}</li>`).join("")
  + me.trustIn.map((e) => `<li><a href="/${esc(e.handle)}">@${esc(e.handle)}</a> ${esc(inLabel[e.kind] || e.kind)} this person${e.reason ? `: “${esc(e.reason)}”` : ""}</li>`).join("")
  + me.trustOut.map((e) => `<li>${esc((kindLabel[e.kind] || e.kind))} <a href="/${esc(e.handle)}">@${esc(e.handle)}</a></li>`).join("")) || "<li class='muted'>no linked identity yet; prove a Bluesky handle from your own page to bring in your Tangled vouches and follows</li>";
{ const canon = location.origin + "/" + me.handle, a = me.about;
  const k = (x) => a.counts[x] ? `${a.counts[x].n} ${x}${a.counts[x].n === 1 ? "" : "s"} from ${a.counts[x].people} ${a.counts[x].people === 1 ? "person" : "people"}` : null;
  $("aboutsum").textContent = [k("upvote"), k("comment"), k("statement")].filter(Boolean).join(" · ") || "Nothing said about this person yet. Upvote or comment below, on this page's address.";
  const w = document.createElement("div"); w.setAttribute("data-attest", ""); w.setAttribute("data-target", canon); w.setAttribute("data-comments", ""); $("aboutw").appendChild(w);
  (await import("/attest.js")).mount(document.getElementById("aboutw")).catch(() => {});
  const elsewhere = a.comments.filter((c) => c.target !== canon);
  $("aboutelse").innerHTML = elsewhere.map((c) => `<li><a href="/${esc(c.handle)}">@${esc(c.handle || A.short(c.by))}</a> on ${c.via === "site" ? "their site" : c.via === "bluesky" ? "their Bluesky profile" : "their page"} (<a href="${esc(c.target)}">${esc(c.target)}</a>): ${esc(c.body)}</li>`).join(""); }
{ const qt = new URLSearchParams(location.search).get("tag"); const list = qt ? me.bookmarks.filter((b) => b.tags.includes(qt)) : me.bookmarks;
  $("nb").textContent = qt ? `tagged ${qt} · ${list.length} (all: ${me.bookmarks.length})` : me.bookmarks.length;
  $("mytags").innerHTML = me.tags.map((t) => `<a href="?tag=${encodeURIComponent(t.tag)}"${t.tag === qt ? ' style="font-weight:600"' : ""}>${esc(t.tag)}</a> <span class="muted">${t.n}</span>`).join(" · ") + (qt ? ` · <a href="?">all</a>` : "");
  $("bms").innerHTML = list.map((b) => `<li style="margin:.45rem 0"><a href="${esc(b.subject)}">${esc(b.title || b.subject)}</a>${b.note ? `<div>${esc(b.note)}</div>` : ""}<div class="muted">${b.tags.map((t) => `<a href="/tag/${encodeURIComponent(t)}">#${esc(t)}</a>`).join(" ")} ${new Date(b.at).toLocaleDateString()}</div></li>`).join("") || "<li class='muted'>none yet</li>"; }
$("counts").textContent = Object.entries(me.counts).map(([k, n]) => `${n} ${k}${n === 1 ? "" : "s"}`).join(" · ");
// vouch button: only on the service's own origin, only for someone else
const s = A.session();
if (s && A.server === location.origin && s.root !== me.did && !me.service) {
  const mine = (await A.by(s.root)); let my = mine.vouches.find((v) => v.target === me.did)?.uri || null;
  const render = () => { $("vouchrow").innerHTML = `<button id="vouch" class="${my ? "" : "quiet"}">${my ? "✓ I know this person · retract" : "I know this person"}</button> <span class="small muted">you have vouched for ${mine.vouches.length} key${mine.vouches.length === 1 ? "" : "s"}</span> <span id="vmsg" class="small err"></span>`;
    $("vouch").onclick = async () => { $("vouch").disabled = true; try { if (my) { await A.attest("retract", me.did, { ref: my }); my = null; } else { const r = await A.attest("vouch", me.did); my = r.uri; } mine.vouches = (await A.by(s.root)).vouches; render(); const fresh = await (await fetch("/handle/" + encodeURIComponent(handle))).json(); $("nvb").textContent = fresh.vouchedBy.length; $("vouchedby").innerHTML = fresh.vouchedBy.map((v) => `<li><a href="/${esc(v.handle)}">@${esc(v.handle || A.short(v.by))}</a></li>`).join("") || "<li class='muted'>nobody yet</li>"; } catch (e) { $("vmsg").textContent = e.message; $("vouch").disabled = false; } }; };
  render();
} else if (s && s.root === me.did) $("vouchrow").innerHTML = `<a href="/me">This is you: sessions, passkeys and proofs</a>`;
else if (!s && A.server === location.origin) $("vouchrow").innerHTML = `<a href="/login?return=${encodeURIComponent("/" + me.handle)}">Sign in</a> to vouch for this person.`;
</script></body></html>
